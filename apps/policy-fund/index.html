<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정책자금 한눈에 보기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#fund-list">목록으로 건너뛰기</a>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <div class="masthead-copy">
        <p class="eyebrow">2026 정책자금 · 소진공 · 중진공</p>
        <h1 id="page-title">정책자금 한눈에 보기</h1>
        <p class="lede">공식 공고를 기준으로 신청 조건, 한도, 금리, 필요 서류를 비교합니다.</p>
        <p class="asof"><span class="stamp" id="as-of"></span><span id="basis"></span></p>
      </div>
      <nav class="sources" aria-label="근거 공고">
        <p class="sources-title">근거 공고</p>
        <ul id="sources"></ul>
      </nav>
    </div>
  </header>

  <div class="wrap shell" id="shell" data-filters="closed">
    <details class="notice" id="notice">
      <summary><span id="notice-title">유의사항</span></summary>
      <ul id="caveats"></ul>
    </details>

    <div class="toolbar">
      <label class="search" for="q">
        <span class="visually-hidden">자금명이나 조건으로 검색</span>
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12.8 12.8 17 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input id="q" type="search" placeholder="자금명, 조건으로 검색" autocomplete="off">
      </label>
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">
        필터<span id="filter-badge" class="filter-badge" hidden></span>
      </button>
    </div>

    <aside id="filters" class="filters" aria-label="필터">
      <div class="facet" id="facet-agency"></div>
      <div class="facet" id="facet-target"></div>
      <div class="facet facet--group" id="facet-group"></div>
      <div class="facet facet--changed" id="facet-changed"></div>
      <button id="reset" class="link-btn" type="button" hidden>필터 초기화</button>
    </aside>

    <section class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">정책자금</h2>
        <p id="count" class="count" aria-live="polite"></p>
        <p class="legend">
          <span class="legend-item"><span class="flag flag--change">변경</span>최초 공고와 달라진 자금</span>
          <span class="legend-item"><span class="flag flag--check">확인 필요</span>공고문에 없는 항목</span>
        </p>
      </div>
      <ul id="fund-list" class="fund-list"></ul>
      <div id="empty" class="empty" hidden>
        <p>조건에 맞는 정책자금이 없습니다.</p>
        <button id="empty-reset" class="btn btn--secondary" type="button">필터 초기화</button>
      </div>
    </section>

    <article id="detail" class="detail" aria-labelledby="detail-title"></article>
  </div>

  <footer class="wrap site-foot">
    <p id="apply-links"></p>
    <p>이 화면은 공식 공고를 정리한 참고 자료입니다. 신청 전에 기관 안내와 공고 원문을 확인하세요.</p>
  </footer>

  <script src="data/funds.js"></script>
  <script src="app.js"></script>
</body>
</html>
