# 네이버 쇼핑검색광고(스마트스토어) 오토파일럿 설정 예시.
# 복사해서 config.toml 로 쓰세요. API 키/웹훅 URL 은 이 파일에 쓰지 말고 환경변수로만 넣습니다.

[global]
db_path = "autopilot.db"
kill_switch_file = "KILL"       # 이 파일이 있으면 모든 run 이 쓰기 없이 중단됩니다
utc_offset_hours = 9            # 한국 시간
total_daily_cap = 400000        # 전체 사이트 합산 일 광고비 상한 (원, VAT 포함)
# 환경변수 이름 목록. 비어 있는 것은 건너뜁니다. 경고/긴급 알림과 일일 요약이 여기로 갑니다.
webhook_url_envs = ["SLACK_WEBHOOK_URL", "DISCORD_WEBHOOK_URL"]
request_min_interval = 0.25     # API 호출 간 최소 간격(초). 429 방지

# ---------------------------------------------------------------- 스마트스토어 (사이트 A)
[sites.site_a]
name = "스마트스토어 A"
customer_id_env = "NAVER_SA_CUSTOMER_A"
api_key_env = "NAVER_SA_API_KEY_A"
secret_env = "NAVER_SA_SECRET_A"

# "ad" = 쇼핑 상품(소재) 단위로 입찰/ON·OFF. 광고그룹 단위로 시작하려면 "adgroup".
level = "ad"
campaign_types = ["SHOPPING"]            # probe 로 실제 campaignTp 값을 확인하세요
ad_types = ["SHOPPING_PRODUCT_AD"]       # level = "ad" 일 때 대상 소재 유형

# 성과 필드 (공식 스펙 기준 구매 전환). probe 가 계정에서 허용되는지 확인해 줍니다.
stat_conversions_field = "purchaseCcnt"
stat_revenue_field = "purchaseConvAmt"

# 목표: 사이트 전체 ROAS 2,000%
target_roas_pct = 2000
# avg_order_value = 30000       # 평균 객단가(원). 비우면 최근 실적에서 계산
daily_budget_cap = 400000       # 사이트 일 광고비 상한(VAT 포함, 원)
# backstop_campaign_budget = 400000   # (선택) 네이버 캠페인 일 예산도 설정. 봇이 멈춰도 상한 유지.
#                                      예산 금액의 VAT 포함 여부를 probe/화면에서 확인한 뒤 켜세요.

lookback_days = 14
cost_multiplier = 1.0           # 공식 스펙: /stats 의 salesAmt 는 이미 VAT 포함. 1.0 유지
roas_lag_adjust = 1.0           # 전환이 늦게 잡혀 ROAS 가 낮게 보이면 1.1 같은 값으로 보정

# 누수 판정
leak_multiplier = 3.0           # 광고비 >= max(leak_min_cost, 3 x 허용CPA) 인데 전환 0 이면 OFF
leak_min_cost = 10000
stoploss_ratio = 0.3            # ROAS 가 목표(2,000%)의 30%(=600%) 미만이면 OFF
probe_threshold_factor = 0.5    # 재진입한 광고는 절반 임계로 더 빨리 판정

# 입찰 조정 (상품 소재는 클릭이 적어 같은 광고그룹의 평균 클릭당 매출로 보정합니다)
min_clicks = 30                 # 이보다 클릭이 적으면 입찰을 바꾸지 않음
prior_clicks = 30               # 광고그룹/사이트 평균으로 끌어당기는 강도(소표본 보정)
bid_alpha = 0.5
max_step_pct = 0.20             # 1회 변경폭 상한 +-20%
deadband_pct = 0.05             # 5% 미만 변경은 무시
cooldown_hours = 20
min_bid = 70                    # 쇼핑검색 최소 입찰가
max_bid = 3000
bid_unit = 10

# 시간대 스케줄: [시작시, 종료시) 구간에는 광고를 끕니다. 예) 새벽 1~7시
off_hours = []                  # 예: [[1, 7]]

# 재진입 (누수로 꺼진 광고 다시 시험)
resume_days = 7                 # 7일 -> 14일 -> 28일 ... 로 간격이 늘어남
max_offs_before_review = 3      # 3번 꺼지면 사람 검토 요청
max_resumes_per_run = 3

# 안전장치
max_off_pct_per_day = 0.25      # 24시간 동안 활성 광고의 25% 를 넘는 OFF 는 승인 대기
defensive_ratio = 0.5           # 사이트 ROAS 가 목표의 50%(=1,000%) 미만이면 입찰 상향/재진입 금지
sanity_min_cost = 30000         # 이 이상 썼는데 전환 0 이면 전환추적 장애로 보고 동결
max_actions_per_run = 200

# 보호: 이 광고들은 절대 건드리지 않습니다
protected_ids = []
protected_name_prefix = "[MANUAL]"

